<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model lab · Ask</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<h1>Ask your photos</h1>
<div id="explain"></div>
<form id="form" class="panel">
  <div class="row">
    <input id="q" type="text" placeholder="e.g. When did we last go to the beach?  ·  What did [name] do in 2023?" style="flex:1;min-width:300px" autofocus>
    <label class="small muted">Model <select id="model"><option value="8b">Qwen3-VL 8B (fast)</option><option value="30b">Qwen3-VL 30B-A3B</option></select></label>
    <button class="primary" id="go">Ask</button>
  </div>
  <details style="margin-top:10px"><summary class="small">Facts the model can use (e.g. birthdays). Kept in this browser only.</summary>
    <textarea id="facts" rows="3" style="width:100%;margin-top:6px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)"
      placeholder="Alex was born 2015-03-02&#10;Our dog Max joined the family in June 2019"></textarea>
  </details>
</form>
<div id="out" style="margin-top:16px"></div>
</main>
<script src="/static/common.js"></script>
<script>
header("/ask");
document.getElementById("explain").innerHTML = explainer("retrieval-augmented generation (RAG)", `
  <p>A language model doesn't know anything about your photos. It only knows what's put in front of it. So answering a question takes three steps,
  and this page shows every one:</p>
  <p><b>1. Filter.</b> If you name someone Photos knows, or a year, the candidates are narrowed first with plain SQL (ADR-0022).
  <b>2. Retrieve.</b> Hybrid search (keyword + SigLIP2 vector, fused with RRF) picks the 10 most relevant items. That's the "R".
  <b>3. Generate.</b> The model reads just those 10 items' <i>text</i> (date, people, caption, tags, text-in-image, speech transcript) and writes an
  answer, citing items as [1], [2]. That's the "AG". It never sees the pixels here.</p>
  <p><b>Why answers can be wrong:</b> if retrieval misses the right photo, the model can't mention it. If a caption is wrong, the answer inherits the
  mistake. And models sometimes "hallucinate", filling gaps with plausible inventions. The prompt forbids guessing and demands citations,
  so you can check every claim against the photo. Ages need a birthday in the Facts box, because Photos doesn't store them.</p>
  <p>The <b>8B</b> is the default: it's reading text, not photos, so the 30B's extra knowledge helps less, and the 8B is faster and light enough to run
  while indexing. This page only searches the ~300 test items, not the whole library yet.</p>`);
const $ = (id) => document.getElementById(id);
try { $("facts").value = localStorage.getItem("lab-facts") || ""; } catch (e) {}
$("facts").addEventListener("input", () => { try { localStorage.setItem("lab-facts", $("facts").value); } catch (e) {} });

function renderAnswer(text, n2id) {
  return esc(text).replace(/\[(\d+)\]/g, (m, n) => n2id[n] ? `<a href="/asset?id=${n2id[n]}" class="badge" title="open item ${n}">${n}</a>` : m).replace(/\n/g, "<br>");
}
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("go").disabled = true;
  $("out").innerHTML = `<p class="muted">Searching, then asking the model… (the first question loads it, a few seconds)</p>`;
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, facts: $("facts").value, model: $("model").value }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const d = await r.json();
    const n2id = Object.fromEntries(d.items.map((i) => [i.n, i.id]));
    const f = d.filters, t = d.timing;
    const filt = [f.people.length ? `person: ${f.people.map(esc).join(", ")}` : "", f.years.length ? `year: ${f.years.join(", ")}` : ""].filter(Boolean).join(" · ");
    $("out").innerHTML = `
      <div class="panel"><h3>Answer</h3><p style="font-size:15px">${renderAnswer(d.answer, n2id)}</p>
        <p class="small muted">${esc(d.model)} · retrieval ${(t.retrieve_s * 1000).toFixed(0)} ms · generation ${t.generate_s.toFixed(1)} s
        ${t.load_s > 0.5 ? `(incl. ${t.load_s.toFixed(1)} s loading the model)` : ""} · ${t.prompt_tokens} tokens read, ${t.output_tokens} written</p></div>
      <h2>What the model was given <span class="small muted">${filt ? `filtered first by ${filt} → ${f.candidates} candidate(s), then` : ""} top ${d.items.length} by hybrid search</span></h2>
      <p class="small muted">Numbered as the model saw them. Outlined = cited in the answer.</p>
      <div class="grid">${d.items.map((i) => {
        const a = d.assets[i.id]; const cited = d.cited.includes(i.n);
        return `<div style="position:relative;${cited ? "outline:3px solid var(--accent);border-radius:10px" : ""}">${card(a, { score: `[${i.n}]`, title: Object.entries(i.parts).map(([m, x]) => `${m} #${x.rank}`).join(", ") })}</div>`;
      }).join("") || '<p class="muted">Nothing matched.</p>'}</div>
      <details style="margin-top:14px"><summary>The exact prompt</summary><h3>System</h3><pre>${esc(d.prompt.system)}</pre><h3>User</h3><pre>${esc(d.prompt.user)}</pre></details>`;
  } catch (err) { $("out").innerHTML = `<p class="bad">Error: ${esc(err.message)}</p>`; }
  $("go").disabled = false;
});
</script></body></html>
